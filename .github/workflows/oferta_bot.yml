name: Oferta Bot

on:
  schedule:
    # A cada 10 minutos, deslocado 3 minutos para evitar o pico do início da hora.
    - cron: "3-59/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oferta-bot
  cancel-in-progress: false

jobs:
  garimpar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --omit=dev

      - name: Executar uma varredura
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_TARGET_CHANNEL: ${{ secrets.TELEGRAM_TARGET_CHANNEL }}
          TELEGRAM_SOURCE_CHANNELS: ${{ secrets.TELEGRAM_SOURCE_CHANNELS }}
          DEAL_SOURCE_URLS: "https://www.promobit.com.br/"
          MAX_DEALS_PER_SCAN: "3"
          AMAZON_TAG: "ofertaradar03-20"
          KABUM_AWIN_TEMPLATE: ${{ secrets.KABUM_AWIN_TEMPLATE }}
          MAGALU_AFFILIATE_TEMPLATE: ${{ secrets.MAGALU_AFFILIATE_TEMPLATE }}
          SHOPEE_AFFILIATE_TEMPLATE: ${{ secrets.SHOPEE_AFFILIATE_TEMPLATE }}
          MERCADOLIVRE_AFFILIATE_TEMPLATE: ${{ secrets.MERCADOLIVRE_AFFILIATE_TEMPLATE }}
          WHATSAPP_ENABLED: "false"
          NODE_ENV: production
        run: npm run run-once

      - name: Manter atividade mensal do repositório
        shell: bash
        run: |
          month="$(date -u +%Y-%m)"
          current=""
          if [ -f data/heartbeat.txt ]; then
            current="$(cat data/heartbeat.txt)"
          fi

          if [ "$current" != "$month" ]; then
            printf '%s\n' "$month" > data/heartbeat.txt
          fi

      - name: Persistir histórico e atividade
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/history.json data/heartbeat.txt

          if ! git diff --cached --quiet; then
            git commit -m "chore(bot): atualizar estado"
            git push origin main
          else
            echo "Nenhuma alteração para salvar."
          fi
