name: Oferta Bot

on:
  push:
    paths:
      - ".github/workflows/oferta_bot.yml"
      - "data/scheduler-heartbeat.txt"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oferta-bot
  cancel-in-progress: true

jobs:
  garimpar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --omit=dev

      - name: Recuperar estado persistente
        shell: bash
        run: |
          git fetch origin bot-state:refs/remotes/origin/bot-state || true

          if git show-ref --verify --quiet refs/remotes/origin/bot-state; then
            git show origin/bot-state:data/history.json > data/history.json || true
          fi

          if [ ! -s data/history.json ]; then
            printf '%s\n' '{"published":{}}' > data/history.json
          fi

      - name: Executar uma varredura
        env:
          TELEGRAM_API_ID: "39797537"
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_TARGET_CHANNEL: "@radardeifertas"
          TELEGRAM_SOURCE_CHANNELS: ""
          DEAL_SOURCE_URLS: "https://www.promobit.com.br/"
          MAX_DEALS_PER_SCAN: "3"
          AMAZON_TAG: "ofertaradar03-20"
          KABUM_AWIN_ADVERTISER_ID: "17729"
          KABUM_AWIN_PUBLISHER_ID: "3114604"
          MAGALU_PARTNER_ID: "magazineoneshotlink"
          SHOPEE_AFFILIATE_TEMPLATE: ""
          MERCADOLIVRE_AFFILIATE_TEMPLATE: ""
          WHATSAPP_ENABLED: "false"
          NODE_ENV: production
        run: npm run run-once

      - name: Atualizar atividade mensal
        shell: bash
        run: |
          month="$(date -u +%Y-%m)"
          current=""

          if [ -f data/heartbeat.txt ]; then
            current="$(cat data/heartbeat.txt)"
          fi

          if [ "$current" != "$month" ]; then
            printf '%s\n' "$month" > data/heartbeat.txt

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/heartbeat.txt

            if ! git diff --cached --quiet; then
              git commit -m "chore: manter atividade do repositório"
              git push origin main
            fi
          fi

      - name: Registrar última execução bem-sucedida
        shell: bash
        run: |
          date -u +%s > data/last_run_unix.txt
          date -u +%Y-%m-%dT%H:%M:%SZ > data/last_run_iso.txt

      - name: Persistir estado em branch separada
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/history.json
          git add -f data/last_run_unix.txt data/last_run_iso.txt

          git commit -m "chore(bot-state): atualizar estado" || true

          git push --force origin HEAD:bot-state

# fluxo de publica��o estabilizado em 2026-10-06
